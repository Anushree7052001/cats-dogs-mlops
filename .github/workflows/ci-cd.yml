name: MLOps CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-mlops

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
      - name: Docker login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Docker host via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export IMAGE_NAME="${{ env.IMAGE_NAME }}:latest"
            mkdir -p ~/cats-dogs-mlops
            cd ~/cats-dogs-mlops
            cat > docker-compose.yml <<'EOF'
            services:
              cats-dogs-api:
                image: ${IMAGE_NAME}
                ports:
                  - "8000:8000"
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
            EOF
            export IMAGE_NAME="$IMAGE_NAME"
            docker compose pull
            docker compose up -d --force-recreate
            sleep 10
            curl --fail http://localhost:8000/health
            echo "Compose deployment and health smoke test passed"

^o

